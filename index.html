    <h1>خدمة التوصيل داخل الجامعة</h1>
    <p>نوصلكم لأي مكان داخل الحرم الجامعي بسهولة وسرعة!</p>
  </header>

  <main>
    <form action="process.php" method="POST" novalidate>
      <label for="fullname">الاسم الكامل:</label>
      <input type="text" id="fullname" name="fullname" required />

      <label for="phone">رقم الجوال:</label>
      <input type="tel" id="phone" name="phone" pattern="05[0-9]{8}" required />

      <label for="restaurant">المطعم:</label>
      <select id="restaurant" name="restaurant" required>
        <option value="">— اختر المطعم —</option>
        <option>كرز البن</option>
        <option>لاروكا</option>
        <option>شباك جيم</option>
        <option>ستاربكس</option>
        <option>3dots</option>
        <option>pulse</option>
        <option>secondCance</option>
        <option>Eat</option>
      </select>

      <label for="building">الوجهة (المبنى):</label>
      <select id="building" name="building" required>
        <option value="">— اختر المبنى —</option>
        <option value="4">4</option>
        <option value="7">7</option>
        <option value="14">14</option>
        <option value="16">16</option>
        <option value="24">24</option>
        <option value="27">27</option>
      </select>

      <label for="floor">الدور:</label>
      <select id="floor" name="floor" required>
        <option value="">— اختر الدور —</option>
        <option value="1">الأول</option>
        <option value="2">الثاني</option>
      </select>

      <label for="order">الرجاء إدخال الطلب:</label>
      <textarea id="order" name="order" rows="4" required></textarea>

      <label for="notes">ملاحظات إضافية:</label>
      <textarea id="notes" name="notes" rows="3"></textarea>

      <button type="submit">إرسال الطلب</button>
    </form>
  </main>
